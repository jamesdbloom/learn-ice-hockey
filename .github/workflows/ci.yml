name: CI

# Every pull request and every push to main. Builds nothing that leaves the
# runner — deployment lives in deploy.yml, so a fork PR can never ship.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and alone: this repository is public, and the account id reached
  # a pushed commit once already because the only thing forbidding it was a
  # sentence of prose in docs/aws-design.md. Standard library, a few seconds.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'

      # No ICE_HOCKEY_AWS_ACCOUNT_ID is exported here, deliberately: putting
      # the account id into a repository secret so CI can grep for it would
      # reintroduce the value this job exists to keep out. CI matches shapes;
      # a local run with the env file sourced additionally matches the literal.
      - name: Scan tracked files for credentials and account identifiers
        run: python3 scripts/check_secrets.py

  links:
    name: Internal links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'

      # Standard library only, so there is nothing to install. This runs
      # against the markdown source, which means it fails in seconds on a
      # renamed file or a reworded heading, before anyone waits for a build.
      - name: Check internal links and heading anchors
        run: python3 scripts/check_links.py --quiet

  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      # `npm run build` also runs Pagefind indexing and the site's own
      # post-build link checker (site/scripts/check-links.mjs), which walks the
      # rendered HTML. That one proves the rewriting and routing preserved the
      # cross-links; scripts/check_links.py proves the source is sound. Both.
      - name: Build
        working-directory: site
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4.4.3
        with:
          name: site-dist
          path: site/dist
          retention-days: 7
          if-no-files-found: error
