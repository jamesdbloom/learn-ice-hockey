name: External link check

# Weekly link-rot sweep over the 610 external citations recorded in
# project/verification/link_baseline.tsv.
#
# It reports *changes against the baseline*, not absolute status: a couple of
# dozen citations 403 every robot on earth, and a handful are deliberately
# retained known-dead links labelled as such in the content. Those are noise and
# the checker treats them as noise.
#
# Failing a cron job in a log nobody reads is not a notification, so new
# breakage opens — or updates — a GitHub issue.

on:
  schedule:
    # 06:17 UTC every Monday. Off the hour, because everyone schedules on the
    # hour and GitHub's queue is honest about the delay that causes.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      sample:
        description: 'Check a random sample of N URLs instead of all of them (0 = all)'
        required: false
        default: '0'
      concurrency:
        description: 'Parallel requests'
        required: false
        default: '6'

permissions:
  contents: read

concurrency:
  group: external-link-check
  cancel-in-progress: false

jobs:
  check:
    name: Refetch citations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write   # to open, update and close the link-rot issue
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'

      - name: Check external links
        id: check
        continue-on-error: true
        run: |
          set -uo pipefail
          SAMPLE="${{ github.event.inputs.sample || '0' }}"
          CONCURRENCY="${{ github.event.inputs.concurrency || '6' }}"
          ARGS=(--quiet --concurrency "$CONCURRENCY" --summary "$GITHUB_STEP_SUMMARY" --json link-report.json)
          if [ "$SAMPLE" != "0" ]; then ARGS+=(--sample "$SAMPLE"); fi
          python3 scripts/check_external_links.py "${ARGS[@]}" | tee link-report.md
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload the report
        uses: actions/upload-artifact@v4.4.3
        with:
          name: external-link-report
          path: |
            link-report.md
            link-report.json
          retention-days: 90
          if-no-files-found: warn

      # One issue, reused. A new issue every week for the same dead link is how
      # you teach people to mute the repository.
      - name: Open or update the link-rot issue
        if: steps.check.outputs.status != '0'
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const fs = require('fs');
            const title = 'Link rot: external citations have broken';
            const label = 'link-rot';
            const body = [
              fs.readFileSync('link-report.md', 'utf8').slice(0, 55000),
              '',
              '---',
              '',
              `Produced by [${context.workflow}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) on ${new Date().toISOString().slice(0, 10)}.`,
              '',
              'Each row is a change against `project/verification/link_baseline.tsv`. For anything under **New breakage**, either fix the citation or retain it deliberately: label it in the content with the status a reader will meet, then refresh the baseline row so it stops being reported as new.',
            ].join('\n');

            const { owner, repo } = context.repo;

            // Make sure the label exists before filtering on it.
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'b60205',
                description: 'External citations that have changed or died',
              });
            }

            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 10,
            });
            const issue = existing.data.find((i) => i.title === title);

            if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Re-checked on ${new Date().toISOString().slice(0, 10)} — still broken. The issue body above has the current report.`,
              });
              core.notice(`Updated issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
              core.notice(`Opened issue #${created.data.number}`);
            }

      # Symmetry matters: an issue that never closes itself is the same as no
      # issue at all.
      - name: Close the link-rot issue if everything recovered
        if: steps.check.outputs.status == '0'
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const title = 'Link rot: external citations have broken';
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'link-rot', per_page: 10,
            });
            for (const issue of existing.data.filter((i) => i.title === title)) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Clean run on ${new Date().toISOString().slice(0, 10)} — no citation is newly broken. Closing.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              core.notice(`Closed issue #${issue.number}`);
            }

      - name: Fail the run if anything is newly broken
        if: steps.check.outputs.status != '0'
        run: |
          echo "::error::New external link breakage — see the job summary and the link-rot issue."
          exit 1
